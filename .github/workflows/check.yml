name: Check branch build
# Compiles and tests every branch other than main, without publishing a release.
# The preview APK is attached to the run under Artifacts.
on:
  push:
    branches-ignore: [main, apk]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest assembleRelease --stacktrace
      - run: cp app/build/outputs/apk/release/app-release.apk akoya-home-preview.apk
      - name: Show the compilation profile packed into the APK
        run: |
          unzip -l akoya-home-preview.apk | grep -E 'dexopt/|classes[0-9]*\.dex' || true
          find app/build/intermediates -iname '*baseline-prof*.txt' -o -iname 'baseline.prof' | while read f; do echo "$(wc -c < "$f") bytes  $(wc -l < "$f") lines  $f"; done
      - uses: actions/upload-artifact@v4
        with:
          name: akoya-home-preview-apk
          path: akoya-home-preview.apk
